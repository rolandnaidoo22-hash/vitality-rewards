 return{v:tierPct(s.hf,s,e.date),b:s.bank.hfBoostOn?num(s.hf.boostPct):0}}

function hbRate(e,s){return{v:tierPct(s.hb,s,e.date),b:s.bank.hbCardOn?num(s.hb.bankPct):0}}

 return entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).map(function(e){

 if(r>rleft){r=round2(Math.max(rleft,0));rv=p?round2(r*rt.v/p):0;rb=round2(r-rv);rc=true}rleft-=r;
 return{id:e.id,qualifying:q,capped:c,capApplied:!below&&c<q,belowMin:below,rewardCapApplied:rc,primary:o.prim?o.prim(e):true,pct:p,pctV:rt.v,pctB:rt.b,rewardV:rv,rewardB:rb,milesV:toMiles(rv,s),milesB:toMiles(rb,s),reward:r,miles:toMiles(r,s),effective:round2(q-r),capLeft:left,rewardLeft:rleft}})}

 var h='<div class="card gbc"><h3>Streaks</h3><div class="gbstreak">'+GB_T.map(function(t){var s=gbStreak(B,t);return'<div><span>'+GBI[t][0]+'</span><b>'+s.seen+'/'+s.total+'</b><small>weeks seen</small><b>'+s.streak+'</b><small>week streak now</small></div>'}).join('')+'</div><div class="muted">🏃 Runner last seen: <b>'+gbFmt(gbStreak(B,'runner').last)+'</b></div></div>';
 return h+GB_T.map(gbHeat).join('')+'<div class="muted">Number = times that tile sat in that cell. Row and column % = share of that tile\'s appearances.</div>'}
function gbGuess(){var B=DB.gb,a=num(S().gb&&S().gb.smooth);var conf=B.length<10?'Very low, just for fun':'Low, just for fun';
 var h='<div class="gbguess"><div class="gbhead"><b>🪙 Lucky guess</b><span class="gbconf">Confidence: '+conf+'</span></div><div class="muted" style="text-align:center">From '+B.length+' logged board'+(B.length===1?'':'s')+' · smoothing '+a+'</div>';
 GB_T.forEach(function(t){var top=gbTop3(B,t,a),h2='<div class="gbmini">';for(var i=0;i<20;i++){var k=top.findIndex(function(x){return x.i===i});h2+='<i class="'+(k===0?'g':k>0?'s':'')+'">'+(k>=0?k+1:'')+'</i>'}h2+='</div>';
  h+='<div class="card gbpc"><div class="gbpt">'+GBI[t][0]+'<b>'+GBI[t][1]+'</b></div>'+h2+'<ol>'+top.map(function(x,k){return'<li class="'+(k?'s':'g')+'"><b>'+x.cell+'</b> '+(x.p*100).toFixed(1)+'%</li>'}).join('')+'</ol></div>'});
 return h+'<div class="gbdisc">Tile placement appears random. This is for entertainment only and can\'t predict the real board.</div></div>'}
function gbData(){var h='<div class="card gbc"><h3>Export</h3><button class="b" id="gbcsv">⬇️ Download CSV</button><div class="hint">Boards are also in the Settings → Advanced → Export JSON backup.</div></div>';
 h+='<div class="card gbc"><h3>Paste dataset</h3><div class="hint">One board per line: <b>date,fuel,basket,runner</b>. Example: <code>28/10/2026,R4C1,R4C3,R3C1</code>. Cells can be R4C1, r4c1 or 4,1. Use none or - if the tile was not there.</div><textarea id="gbpaste" rows="7" placeholder="date,fuel,basket,runner&#10;2026-10-28,R4C1,R4C3,R3C1&#10;21/10/2026,4,1,none,3,1">'+esc(gbPaste)+'</textarea><button class="b" id="gbprev">Check it</button>';
 if(gbPrev){var ok=gbPrev.filter(function(r){return r.ok}),bad=gbPrev.length-ok.length,over=ok.filter(function(r){return DB.gb.some(function(b){return b.date===r.date})}).length;
  h+='<div class="'+(bad?'warn':'ok')+'">'+ok.length+' line'+(ok.length===1?'':'s')+' ready'+(bad?', '+bad+' with a problem (skipped)':'')+(over?'. '+over+' will replace weeks you already logged':'')+'.</div><div class="gbprev">'+gbPrev.slice().sort(function(a,b){return a.ok-b.ok||a.line-b.line}).map(function(r){return'<div class="'+(r.ok?'':'bad')+'"><span>'+r.line+'</span>'+(r.ok?'✅ '+gbFmt(r.date)+' · ⛽ '+r.fuel+' · 🧺 '+r.basket+' · 🏃 '+r.runner:'❌ <code>'+esc(r.raw)+'</code><br>'+esc(r.err))+'</div>'}).join('')+'</div>';
  if(ok.length)h+='<button class="b gbgo" id="gbimp">Import '+ok.length+' board'+(ok.length===1?'':'s')+'</button>'}
 if(gbMsg)h+='<div class="ok">'+esc(gbMsg)+'</div>';return h+'</div>'}
function bindGB(){var q=function(s){return document.querySelectorAll(s)},g=function(i){return document.getElementById(i)};
 q('[data-gbv]').forEach(function(b){b.onclick=function(){gbView=b.dataset.gbv;gbMsg='';gbDelArm=null;render();scrollTo(0,0)}});

 if(g('gbnone'))g('gbnone').onclick=function(){gbDraft[gbTile]=gbDraft[gbTile]==='none'?null:'none';var nx=GB_T.find(function(t){return gbDraft[t]==null});if(gbDraft[gbTile]&&nx)gbTile=nx;gbMsg='';render()};

  var rec={id:d.id||uid(),date:gbWed(d.date),fuel:d.fuel,basket:d.basket,runner:d.runner},i=DB.gb.findIndex(function(b){return b.id===rec.id});if(i>=0)DB.gb[i]=rec;else DB.gb.push(rec);save();gbDraft=null;gbTile='fuel';gbMsg='';render()};
 if(g('gbcancel'))g('gbcancel').onclick=function(){gbDraft=null;gbMsg='';render()};
 q('[data-gbed]').forEach(function(b){b.onclick=function(){gbDraft=gbNewDraft(DB.gb.find(function(x){return x.id===b.dataset.gbed}));gbMsg='';render();scrollTo(0,0)}});
 q('[data-gbdel]').forEach(function(b){b.onclick=function(){var id=b.dataset.gbdel;if(gbDelArm!==id){gbDelArm=id;return render()}DB.gb=DB.gb.filter(function(x){return x.id!==id});gbDelArm=null;if(gbDraft&&gbDraft.id===id)gbDraft=null;save();render()}});
 if(g('gbcsv'))g('gbcsv').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gbToCSV(DB.gb)],{type:'text/csv'}));a.download='gameboard.csv';a.click()};
 if(g('gbpaste'))g('gbpaste').oninput=function(){gbPaste=this.value};
 if(g('gbprev'))g('gbprev').onclick=function(){gbPaste=g('gbpaste').value;gbPrev=gbParseCSV(gbPaste);gbMsg='';render()};
 if(g('gbimp'))g('gbimp').onclick=function(){var n=0;gbPrev.filter(function(r){return r.ok}).forEach(function(r){var rec={id:uid(),date:r.date,fuel:r.fuel,basket:r.basket,runner:r.runner},i=DB.gb.findIndex(function(b){return b.date===r.date});if(i>=0){rec.id=DB.gb[i].id;DB.gb[i]=rec}else DB.gb.push(rec);n++});save();gbPrev=null;gbPaste='';gbMsg='Imported '+n+' boards. See them under Stats and Guess.';render()}}
